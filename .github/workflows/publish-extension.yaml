name: Publish extension

on:
  release:
    types: [published]
    
jobs:
  publish:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx @vscode/vsce publish --oidc
