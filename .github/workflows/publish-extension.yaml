name: Publish extension

on:
  workflow_dispatch: {}
  release:
    types: [published]
    
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=volfied.mallorn-theme
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes @vscode/vsce publish --oidc --no-update-package-json
